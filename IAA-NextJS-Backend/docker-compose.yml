services:
  db:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: iaa
      POSTGRES_USER: iaa_owner
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?Set LOCAL_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - iaa_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iaa_owner -d iaa"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  iaa_pg:
